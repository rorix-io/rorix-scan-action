name: Smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create an empty smoke-test workspace
        run: mkdir smoke-empty

      - name: Install the public CLI and invoke the Action
        id: rorix
        uses: ./
        with:
          api-key: rxk_smoke_test_not_a_real_credential
          command: scan
          path: smoke-empty

      - name: Verify the propagated exit code
        env:
          RORIX_EXIT_CODE: ${{ steps.rorix.outputs.exit-code }}
        run: test "$RORIX_EXIT_CODE" = "0"
